<style>

<script>
/* ====== SUPABASE CONNECTION (already filled in for your project) ====== */
const SUPABASE_URL='https://rzbythfivpsdhawodkth.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6Ynl0aGZpdnBzZGhhd29ka3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTE0ODEsImV4cCI6MjEwODkyNzQ4MX0.I-mgGTMdchJa5jGq2tgYepvx68l4e5ZpdfvGIn-BJ8s';
/* ======================================================================= */
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},realtime:{params:{eventsPerSecond:10}}});
let adminPin=null;
/* ---- tiny data layer: same shape the app already uses, but backed by Supabase (Postgres + Realtime) ---- */
const snake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase()),camel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
const toDb=o=>{const r={};for(const k in o)r[snake(k)]=o[k];return r};
const fromDb=o=>{const r={};for(const k in o)r[camel(k)]=o[k];return r};
const COLS={users:'id,name,pts,role,t,manual'};
const cols=c=>COLS[c]||'*';
async function fetchRows(c,ord,lim){let q=sb.from(c).select(cols(c));if(ord)q=q.order(snake(ord[0]),{ascending:ord[1]!=='desc'});
 const {data,error}=await q.limit(lim||1000);if(error)throw error;return data.map(r=>({id:r.id,data:()=>fromDb(r)}))}
const dref=(c,id)=>({id,
 get:async()=>{const {data,error}=await sb.from(c).select(cols(c)).eq('id',id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data?fromDb(data):undefined}},
 set:async o=>{const {error}=await sb.from(c).insert(Object.assign({id},toDb(o)));if(error&&error.code!=='23505')throw error},
 update:async o=>{const {error}=await sb.from(c).update(toDb(o)).eq('id',id);if(error)throw error}});
function qry(c,ord,lim){return{
 orderBy:(f,d)=>qry(c,[f,d||'asc'],lim),limit:n=>qry(c,ord,n),
 get:async()=>{const docs=await fetchRows(c,ord,lim);return{docs,empty:!docs.length}},
 onSnapshot:(cb,onErr)=>{let prev=new Set(),dead=false,timer=null,seq=0;
  const run=async()=>{const my=++seq;try{const docs=await fetchRows(c,ord,lim);if(dead||my!==seq)return;const added=docs.filter(d=>!prev.has(d.id));prev=new Set(docs.map(d=>d.id));
   cb({docs,empty:!docs.length,docChanges:()=>added.map(d=>({type:'added',doc:d}))})}catch(e){if(!dead&&onErr)onErr(e)}};
  const kick=()=>{clearTimeout(timer);timer=setTimeout(run,120)};
  const ch=sb.channel('rt-'+c+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:c},kick).subscribe(s=>{if(s==='SUBSCRIBED')run()});
  const vis=()=>{if(!document.hidden)run()};document.addEventListener('visibilitychange',vis);run();
  return()=>{dead=true;clearTimeout(timer);document.removeEventListener('visibilitychange',vis);sb.removeChannel(ch)}}}}
const dbShim={collection:c=>Object.assign(qry(c,null,0),{doc:id=>dref(c,id),add:async o=>{const {error}=await sb.from(c).insert(toDb(o));if(error)throw error;return{}}})};
/* ---- login layer ---- */
const mkUser=u=>u?{uid:u.id,email:u.email,displayName:(u.user_metadata&&u.user_metadata.name)||''}:null;
const authShim={
 onAuthStateChanged:f=>{let last;sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{const p=prompt('Enter your new password (min 6 characters)');if(p&&p.length>=6)sb.auth.updateUser({password:p}).then(r=>toast(r.error?r.error.message:'Password updated'));else if(p)toast('Password must be at least 6 characters')},600);
  const u=s&&s.user||null,id=u?u.id:null;if(last!==undefined&&id===last)return;last=id;setTimeout(()=>f(mkUser(u)),0)})},
 createUserWithEmailAndPassword:async(em,pw,meta)=>{const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:meta||{}}});if(error)throw error;
  if(!data.session)throw new Error('Account created. Please confirm your email, then log in.');return{user:mkUser(data.user)}},
 signInWithEmailAndPassword:async(em,pw)=>{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error},
 signOut:async()=>{await sb.auth.signOut()},
 sendPasswordResetEmail:async em=>{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error}};
/* ---- photos go to Supabase Storage (public bucket), only the link is saved in the report ---- */
async function upPhoto(dataUrl){const blob=await (await fetch(dataUrl)).blob(),ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg',
 path=U.uid+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
 const {error}=await sb.storage.from('report-photos').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});if(error)throw error;
 return sb.storage.from('report-photos').getPublicUrl(path).data.publicUrl}
const READY=true,DEMO=false;
const GH=[
 {n:'NIT Patna Campus',q:'NIT Patna, Ashok Rajpath, Patna, Bihar'},{n:'NIT Ghat',q:'NIT Ghat, Patna, Bihar'},
 {n:'Gandhi Ghat',q:'Gandhi Ghat, Patna, Bihar'},{n:'Gulabi Ghat',q:'Gulabi Ghat, Patna, Bihar'},
 {n:'Kangan Ghat',q:'Kangan Ghat, Patna, Bihar'},{n:'LCT Ghat',q:'LCT Ghat, Patna, Bihar'},{n:'Collectorate Ghat',q:'Collectorate Ghat, Patna, Bihar'}];
const BADGES=[[10,'First Step'],[50,'Ghat Friend'],[120,'Ganga Guardian'],[250,'Namami Hero']];
const ICON={report:'📸',accept:'🤝',clean:'✅',admin:'🛠️',sponsor:'🤝',pledge:'🙏',join:'👋'};
let auth,db,U=null,ME=null,users=[],reports=[],acts=[],sponsors=[],offs=[],firstAct=true;
let tab='report',ctab='mot',rmId=null,filter='All',mode='login',confirmReset=false,busy=false;
let adminOn=false;
let draft={photo:null,lat:null,lon:null,g:0,note:'',gpsMsg:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
const errMsg=e=>String(e&&e.message||e).replace('Firebase: ','');
function go(t){tab=t;confirmReset=false;adminOn=false;adminPin=null;rmId=null;draw()}
const rep=id=>reports.find(r=>r.id===id);
const isVol=()=>!!(ME&&ME.role==='volunteer');
async function log(type,text){try{await db.collection('activity').add({type,text,uid:U.uid,t:Date.now()})}catch(e){}}
function notify(text){toast('🔔 '+text);try{if(window.Notification&&Notification.permission==='granted')new Notification('SwachhSetu',{body:text})}catch(e){}}
async function enableAlerts(){try{const p=await Notification.requestPermission();toast(p==='granted'?'Phone alerts enabled':'Alerts blocked. In-app alerts still work.')}catch(e){toast('Alerts are not supported here. In-app alerts still work.')}}
/* ---------- init ---------- */
function init(){
 auth=authShim;db=dbShim;
 auth.onAuthStateChanged(async u=>{
  offs.forEach(f=>f());offs=[];U=u;ME=null;firstAct=true;
  if(u){
   try{const ref=db.collection('users').doc(u.uid),s=await ref.get();
    if(!s.exists)await ref.set({name:u.displayName||(u.email||'User').split('@')[0],email:u.email||'',pts:0,role:'citizen',t:Date.now()})}catch(e){toast(errMsg(e))}
   const fail=e=>toast(errMsg(e));
   offs.push(db.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));const had=!!ME;ME=users.find(x=>x.id===u.uid)||null;if(had&&!ME){toast('You were removed by the admin.');auth.signOut();return}sd()},fail));
   offs.push(db.collection('reports').orderBy('t','desc').limit(100).onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('activity').orderBy('t','desc').limit(40).onSnapshot(s=>{
    if(!firstAct)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().uid!==u.uid)notify(c.doc.data().text)});
    firstAct=false;acts=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('sponsors').orderBy('t','desc').limit(50).onSnapshot(s=>{sponsors=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
  }
  draw()})}
function sd(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;draw()}
/* ---------- auth ---------- */
async function doLogin(){try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){toast(errMsg(e))}}
async function doRegister(){
 const nm=$('nm').value.trim(),em=$('em').value.trim(),pw=$('pw').value,rl=$('rl').value;
 if(!nm){toast('Enter your name');return}
 try{const c=await auth.createUserWithEmailAndPassword(em,pw,{name:nm.slice(0,30),role:rl});
  db.collection('activity').add({type:'join',text:nm.slice(0,30)+' joined SwachhSetu as a '+rl,uid:c.user.uid,t:Date.now()}).catch(()=>{});toast('Welcome, '+nm+'!')}catch(e){toast(errMsg(e))}}
async function resetPw(){const em=$('em').value.trim();if(!em){toast('Enter your email first');return}try{await auth.sendPasswordResetEmail(em);toast('Password reset email sent')}catch(e){toast(errMsg(e))}}
function logout(){auth.signOut();tab='report'}
async function setRole(r){try{await db.collection('users').doc(U.uid).update({role:r})}catch(e){toast(errMsg(e))}}
/* ---------- photos ---------- */
document.addEventListener('change',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('file'))onPhoto(t)});
function onPhoto(t){
 const f=t.files&&t.files[0],kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{
  if(kind==='new'){draft.photo=u;draw();toast('Photo added')}
  else if(kind==='before'){const url=await upPhoto(u);await db.collection('reports').doc(id).update({photo:url});toast('Before photo saved')}
  else if(kind==='after'){const r=rep(id),url=await upPhoto(u);await db.collection('reports').doc(id).update({st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});
   await log('clean',ME.name+' cleaned '+GH[r.g].n);toast('Cleanup recorded. +30 points')}
 }catch(e){toast(errMsg(e))}})}
function readPhoto(file,cb){
 const r=new FileReader();r.onerror=()=>toast('Could not read this photo');
 r.onload=()=>{const raw=r.result,im=new Image();
  im.onload=()=>{try{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))}catch(e){cb(raw)}};
  im.onerror=()=>{if(String(raw).length<700000)cb(raw);else toast('Photo format not supported. Use JPG or PNG.')};im.src=raw};
 r.readAsDataURL(file)}
const fileIn=(kind,id,label)=>`<div class="fi"><span>${label}</span><input class="file" type="file" accept="image/*" data-kind="${kind}" data-id="${id}"></div>`;
/* ---------- actions ---------- */
function getGPS(){
 if(!window.isSecureContext||!navigator.geolocation){draft.gpsMsg='GPS needs the https link (not a downloaded file). The selected ghat will be used.';draw();return}
 draft.gpsMsg='Finding your location...';draw();
 navigator.geolocation.getCurrentPosition(p=>{draft.lat=p.coords.latitude.toFixed(5);draft.lon=p.coords.longitude.toFixed(5);draft.gpsMsg='📍 Location added: '+draft.lat+', '+draft.lon;draw()},
 e=>{draft.lat=null;draft.gpsMsg=e.code===1?'Location permission denied. In Chrome tap the lock icon > Permissions > Location > Allow, then try again.':'Could not get location. Turn on phone GPS and try again. The ghat will be used meanwhile.';draw()},{timeout:10000,enableHighAccuracy:true})}
async function submitReport(){
 if(busy)return;if(!draft.photo){toast('Add a photo of the waste first');return}
 const note=draft.note.trim().slice(0,300)||'Waste reported';busy=true;
 try{toast('Uploading...');const url=String(draft.photo).startsWith('data:')?await upPhoto(draft.photo):draft.photo;
  await db.collection('reports').add({g:draft.g,note,st:'Reported',t:Date.now(),photo:url,after:null,lat:draft.lat,lon:draft.lon,repUid:U.uid,repName:ME.name,byUid:null,byName:null});
  await log('report',ME.name+' reported waste at '+GH[draft.g].n);
  draft={photo:null,lat:null,lon:null,g:draft.g,note:'',gpsMsg:''};toast('Report submitted. +10 points');tab='list';filter='All'}catch(e){toast(errMsg(e))}
 busy=false;draw()}
async function takeTask(id){try{const r=rep(id);await db.collection('reports').doc(id).update({st:'Assigned',byUid:U.uid,byName:ME.name});
 await log('accept',ME.name+' accepted the task at '+GH[r.g].n);toast('Task accepted. +5 points')}catch(e){toast(errMsg(e))}}
async function delReport(id){try{await adm('admin_delete_report',{p_id:id});toast('Report deleted')}catch(e){toast(errMsg(e))}}
async function reopen(id){try{await adm('admin_reopen_report',{p_id:id});toast('Report reopened')}catch(e){toast(errMsg(e))}}
const navUrl=r=>'https://www.google.com/maps/dir/?api=1&destination='+(r.lat?r.lat+','+r.lon:encodeURIComponent(GH[r.g].q));
const gUrl=i=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(GH[i].q);
const stats=i=>{const f=s=>reports.filter(r=>r.g===i&&r.st===s).length,a=f('Assigned'),r=f('Reported');return{r,a,c:f('Cleaned'),p:r+a}};
/* ---------- views ---------- */
function vAuth(){const reg=mode==='register';return `<div class="card"><h2>${reg?'Create account':'Log in'}</h2>
 ${reg?`<label class="l" for="nm">Full name</label><input type="text" id="nm" maxlength="30" autocomplete="name">`:''}
 <label class="l" for="em">Email</label><input type="email" id="em" autocomplete="email">
 <label class="l" for="pw">Password (min 6 characters)</label><input type="password" id="pw" autocomplete="${reg?'new-password':'current-password'}">

 return `<div class="card"><div class="tot"><div><b style="color:var(--red)">${T('r')}</b>Reported</div><div><b style="color:var(--blue)">${T('a')}</b>In progress</div><div><b style="color:var(--green)">${T('c')}</b>Cleaned</div></div></div>

 <div class="card"><h2>Reset the whole app</h2><p class="note">Deletes every report, photo and activity item for ALL users and sets all points to 0. Accounts stay.</p>${confirmReset?`<div class="acts"><button class="btn red" onclick="doReset()">Yes, erase everything</button><button class="ic" onclick="confirmReset=false;draw()">Cancel</button></div>`:`<div class="acts"><button class="btn red" onclick="confirmReset=true;draw()">Reset app</button></div>`}</div>`}
function draw(){
 const gate=!U||!ME;
 $('roles').style.display=!gate?'flex':'none';
 if(!gate)['citizen','volunteer'].forEach(x=>$('r-'+x).classList.toggle('on',ME.role===x));
 $('who').innerHTML=U&&ME?`Signed in as <b>${esc(ME.name)}</b>${adminOn?' (Admin)':''} · <a onclick="logout()">Log out</a>`:'';
 $('nav').style.display=gate?'none':'flex';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-t')===tab));
 let h;
 if(!U)h=vAuth();else if(!ME)h='<div class="empty">Loading...</div>';
 else h=({report:vReport,map:vMap,list:vList,board:vBoard,comm:vComm,admin:vAdmin})[tab]();
 $('app').innerHTML=h}

init();
</script>
</body>
</html>
