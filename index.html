<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwachhSetu – Clean Ganga Ghats Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#EAF2F1;--card:#fff;--ink:#10242B;--mute:#5B7178;--river:#0E4D64;--gold:#F2A900;--red:#C8452D;--blue:#2F7FBF;--green:#2E8B57;--line:#CFE0DE;--onriver:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0B1B21;--card:#12292F;--ink:#E6F1F0;--mute:#8FA8AE;--river:#5FB3CF;--line:#244047;--onriver:#08202A}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:16px;line-height:1.45}
header{background:var(--river);color:var(--onriver);padding:14px 16px 12px}
header h1{margin:0;font-size:26px;font-weight:800}header p{margin:0;font-size:13px;opacity:.92}
.who{font-size:12px;margin-top:6px}.who a{text-decoration:underline;cursor:pointer}
.role{display:none;gap:6px;margin-top:8px}
.role button{flex:1;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:5px;font:600 14px Mukta,sans-serif;cursor:pointer}
.role button.on{background:var(--gold);border-color:var(--gold);color:#10242B}
main{padding:14px 14px 90px;max-width:680px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
label.l{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
select,textarea,input[type=text],input[type=password],input[type=email],input[type=number]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px Mukta,sans-serif}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;font:700 14px Mukta,sans-serif;background:var(--river);color:var(--onriver);cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:var(--gold);color:#10242B}.btn.full{width:100%;margin-top:12px;padding:12px;font-size:15px}.btn.red{background:var(--red);color:#fff}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fi{margin-top:8px;font-size:13px;font-weight:600}.fi span{display:block;margin-bottom:3px}
input.file{width:100%;font:14px Mukta,sans-serif;color:var(--ink)}
input.file::file-selector-button{border:0;border-radius:8px;padding:9px 14px;margin-right:10px;background:var(--gold);color:#10242B;font:700 14px Mukta,sans-serif;cursor:pointer}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px}
.gps,.note{font-size:13px;color:var(--mute)}.note{font-size:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.s-Reported{background:var(--red)}.s-Assigned{background:var(--blue)}.s-Cleaned{background:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.steps{display:flex;margin:10px 0 4px;font-size:12px;color:var(--mute)}
.steps span{flex:1;text-align:center;border-top:4px solid var(--line);padding-top:3px}
.steps span.done{border-color:var(--green);color:var(--ink);font-weight:600}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ba figure{margin:0;font-size:12px;color:var(--mute)}.ba img,.ph{width:100%;height:110px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:600 13px Mukta,sans-serif;cursor:pointer}
.chips button.on{background:var(--river);color:var(--onriver);border-color:var(--river)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px;font:600 11px Mukta,sans-serif;cursor:pointer}
nav button.on{color:var(--river);box-shadow:inset 0 3px 0 var(--gold)}nav b{display:block;font-size:19px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--red)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mute);padding:20px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tot b{display:block;font-size:26px}
.lb{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}.lb .nm{flex:1}.lb.me{font-weight:800}
.ic{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 10px;font:600 13px Mukta,sans-serif;cursor:pointer}
.tag{background:var(--gold);color:#10242B;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
.feed{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed i{font-style:normal;font-size:20px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.quote{background:var(--river);color:var(--onriver);border:0}.quote p{font-size:19px;font-weight:600;margin:6px 0 0}.quote .note{color:inherit;opacity:.85}
</style>
</head>
<body>
<header>
  <h1>SwachhSetu</h1>
  <p>The bridge between citizens and volunteers for clean Ganga ghats · Namami Gange</p>
  <div class="role" id="roles" role="group" aria-label="Choose role"><button id="r-citizen" onclick="setRole('citizen')">Citizen</button><button id="r-volunteer" onclick="setRole('volunteer')">Volunteer</button></div>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-t="report" onclick="go('report')"><b>📸</b>Report</button>
  <button data-t="map" onclick="go('map')"><b>🗺️</b>Hotspots</button>
  <button data-t="list" onclick="go('list')"><b>📋</b>Status</button>
  <button data-t="board" onclick="go('board')"><b>🏅</b>Leaders</button>
  <button data-t="comm" onclick="go('comm')"><b>👥</b>Community</button>
  <button data-t="admin" onclick="go('admin')"><b>🛠️</b>Admin</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== SUPABASE CONFIG (project URL + public anon key; safe to keep in the page) ====== */
const SUPA_URL="https://rzbythfivpsdhawodkth.supabase.co",SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6Ynl0aGZpdnBzZGhhd29ka3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTE0ODEsImV4cCI6MjEwODkyNzQ4MX0.I-mgGTMdchJa5jGq2tgYepvx68l4e5ZpdfvGIn-BJ8s";
const firebaseConfig={apiKey:SUPA_KEY};
/* ================================================================================== */
const READY=!/^PASTE/.test(firebaseConfig.apiKey),DEMO=!READY;
const GH=[
 {n:'NIT Patna Campus',q:'NIT Patna, Ashok Rajpath, Patna, Bihar'},{n:'NIT Ghat',q:'NIT Ghat, Patna, Bihar'},
 {n:'Gandhi Ghat',q:'Gandhi Ghat, Patna, Bihar'},{n:'Gulabi Ghat',q:'Gulabi Ghat, Patna, Bihar'},
 {n:'Kangan Ghat',q:'Kangan Ghat, Patna, Bihar'},{n:'LCT Ghat',q:'LCT Ghat, Patna, Bihar'},{n:'Collectorate Ghat',q:'Collectorate Ghat, Patna, Bihar'}];
const BADGES=[[10,'First Step'],[50,'Ghat Friend'],[120,'Ganga Guardian'],[250,'Namami Hero']];
const ICON={report:'📸',accept:'🤝',clean:'✅',admin:'🛠️',sponsor:'🤝',pledge:'🙏',join:'👋'};
let auth,db,U=null,ME=null,users=[],reports=[],acts=[],sponsors=[],offs=[],firstAct=true;
let tab='report',ctab='mot',rmId=null,filter='All',mode='login',confirmReset=false,busy=false;
let adminOn=false;
let draft={photo:null,lat:null,lon:null,g:0,note:'',gpsMsg:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
const errMsg=e=>String(e&&e.message||e).replace('Firebase: ','');
function go(t){tab=t;confirmReset=false;adminOn=false;rmId=null;draw()}
const rep=id=>reports.find(r=>r.id===id);
const isVol=()=>!!(ME&&ME.role==='volunteer');
const inc=n=>firebase.firestore.FieldValue.increment(n);
async function log(type,text){try{await db.collection('activity').add({type,text,uid:U.uid,t:Date.now()})}catch(e){}}
function notify(text){toast('🔔 '+text);try{if(window.Notification&&Notification.permission==='granted')new Notification('SwachhSetu',{body:text})}catch(e){}}
async function enableAlerts(){try{const p=await Notification.requestPermission();toast(p==='granted'?'Phone alerts enabled':'Alerts blocked. In-app alerts still work.')}catch(e){toast('Alerts are not supported here. In-app alerts still work.')}}
/* ---------- init ---------- */
function init(){
 firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async u=>{
  offs.forEach(f=>f());offs=[];U=u;ME=null;firstAct=true;
  if(u){
   try{const ref=db.collection('users').doc(u.uid),s=await ref.get();
    if(!s.exists)await ref.set({name:u.displayName||(u.email||'User').split('@')[0],email:u.email||'',pts:0,role:'citizen',t:Date.now()})}catch(e){toast(errMsg(e))}
   const fail=e=>toast(errMsg(e));
   offs.push(db.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));const had=!!ME;ME=users.find(x=>x.id===u.uid)||null;if(had&&!ME){toast('You were removed by the admin.');auth.signOut();return}sd()},fail));
   offs.push(db.collection('reports').orderBy('t','desc').limit(100).onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('activity').orderBy('t','desc').limit(40).onSnapshot(s=>{
    if(!firstAct)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().uid!==u.uid)notify(c.doc.data().text)});
    firstAct=false;acts=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('sponsors').orderBy('t','desc').limit(50).onSnapshot(s=>{sponsors=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
  }
  draw()})}
function sd(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;draw()}
/* ---------- auth ---------- */
async function doLogin(){try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){toast(errMsg(e))}}
async function doRegister(){
 const nm=$('nm').value.trim(),em=$('em').value.trim(),pw=$('pw').value,rl=$('rl').value;
 if(!nm){toast('Enter your name');return}
 try{const c=await auth.createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:nm});
  await db.collection('users').doc(c.user.uid).set({name:nm.slice(0,30),email:em,pts:0,role:rl,t:Date.now()},{merge:true});db.collection('activity').add({type:'join',text:nm+' joined SwachhSetu as a '+rl,uid:c.user.uid,t:Date.now()}).catch(()=>{});toast('Welcome, '+nm+'!')}catch(e){toast(errMsg(e))}}
async function resetPw(){const em=$('em').value.trim();if(!em){toast('Enter your email first');return}try{await auth.sendPasswordResetEmail(em);toast('Password reset email sent')}catch(e){toast(errMsg(e))}}
function logout(){auth.signOut();tab='report'}
async function setRole(r){try{await db.collection('users').doc(U.uid).update({role:r})}catch(e){toast(errMsg(e))}}
/* ---------- photos ---------- */
document.addEventListener('change',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('file'))onPhoto(t)});
function onPhoto(t){
 const f=t.files&&t.files[0],kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{
  if(kind==='new'){draft.photo=u;draw();toast('Photo added')}
  else if(kind==='before'){await db.collection('reports').doc(id).update({photo:u});toast('Before photo saved')}
  else if(kind==='after'){const r=rep(id);await db.collection('reports').doc(id).update({st:'Cleaned',after:u,byUid:U.uid,byName:ME.name});
   await db.collection('users').doc(U.uid).update({pts:inc(30)});await log('clean',ME.name+' cleaned '+GH[r.g].n);toast('Cleanup recorded. +30 points')}
 }catch(e){toast(errMsg(e))}})}
function readPhoto(file,cb){
 const r=new FileReader();r.onerror=()=>toast('Could not read this photo');
 r.onload=()=>{const raw=r.result,im=new Image();
  im.onload=()=>{try{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))}catch(e){cb(raw)}};
  im.onerror=()=>{if(String(raw).length<700000)cb(raw);else toast('Photo format not supported. Use JPG or PNG.')};im.src=raw};
 r.readAsDataURL(file)}
const fileIn=(kind,id,label)=>`<div class="fi"><span>${label}</span><input class="file" type="file" accept="image/*" data-kind="${kind}" data-id="${id}"></div>`;
/* ---------- actions ---------- */
function getGPS(){
 if(!window.isSecureContext||!navigator.geolocation){draft.gpsMsg='GPS needs the https link (not a downloaded file). The selected ghat will be used.';draw();return}
 draft.gpsMsg='Finding your location...';draw();
 navigator.geolocation.getCurrentPosition(p=>{draft.lat=p.coords.latitude.toFixed(5);draft.lon=p.coords.longitude.toFixed(5);draft.gpsMsg='📍 Location added: '+draft.lat+', '+draft.lon;draw()},
 e=>{draft.lat=null;draft.gpsMsg=e.code===1?'Location permission denied. In Chrome tap the lock icon > Permissions > Location > Allow, then try again.':'Could not get location. Turn on phone GPS and try again. The ghat will be used meanwhile.';draw()},{timeout:10000,enableHighAccuracy:true})}
async function submitReport(){
 if(busy)return;if(!draft.photo){toast('Add a photo of the waste first');return}
 const note=draft.note.trim()||'Waste reported';busy=true;
 try{await db.collection('reports').add({g:draft.g,note,st:'Reported',t:Date.now(),photo:draft.photo,after:null,lat:draft.lat,lon:draft.lon,repUid:U.uid,repName:ME.name,byUid:null,byName:null});
  await db.collection('users').doc(U.uid).update({pts:inc(10)});await log('report',ME.name+' reported waste at '+GH[draft.g].n);
  draft={photo:null,lat:null,lon:null,g:draft.g,note:'',gpsMsg:''};toast('Report submitted. +10 points');tab='list';filter='All'}catch(e){toast(errMsg(e))}
 busy=false;draw()}
async function takeTask(id){try{const r=rep(id);await db.collection('reports').doc(id).update({st:'Assigned',byUid:U.uid,byName:ME.name});
 await db.collection('users').doc(U.uid).update({pts:inc(5)});await log('accept',ME.name+' accepted the task at '+GH[r.g].n);toast('Task accepted. +5 points')}catch(e){toast(errMsg(e))}}
async function delReport(id){try{await db.collection('reports').doc(id).delete();toast('Report deleted')}catch(e){toast(errMsg(e))}}
async function reopen(id){try{await db.collection('reports').doc(id).update({st:'Reported',after:null,byUid:null,byName:null});toast('Report reopened')}catch(e){toast(errMsg(e))}}
const navUrl=r=>'https://www.google.com/maps/dir/?api=1&destination='+(r.lat?r.lat+','+r.lon:encodeURIComponent(GH[r.g].q));
const gUrl=i=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(GH[i].q);
const stats=i=>{const f=s=>reports.filter(r=>r.g===i&&r.st===s).length,a=f('Assigned'),r=f('Reported');return{r,a,c:f('Cleaned'),p:r+a}};
/* ---------- views ---------- */
function vSetup(){return `<div class="card"><h2>One-time Firebase setup</h2><p>Open this file in a text editor and paste your Firebase web config where it says <code>PASTE_API_KEY</code>. Then host the file (Firebase Hosting or Netlify) and open the https link.</p></div>`}
function vAuth(){const reg=mode==='register';return `<div class="card"><h2>${reg?'Create account':'Log in'}</h2>
 ${reg?`<label class="l" for="nm">Full name</label><input type="text" id="nm" maxlength="30" autocomplete="name">`:''}
 <label class="l" for="em">Email</label><input type="email" id="em" autocomplete="email">
 <label class="l" for="pw">Password (min 6 characters)</label><input type="password" id="pw" autocomplete="${reg?'new-password':'current-password'}">
 ${reg?`<label class="l" for="rl">I want to join as</label><select id="rl"><option value="citizen">Citizen (report waste)</option><option value="volunteer">Volunteer (clean waste)</option></select>`:''}
 <button class="btn full" onclick="${reg?'doRegister()':'doLogin()'}">${reg?'Register':'Log in'}</button>
 <div class="acts"><button class="ic" onclick="mode='${reg?'login':'register'}';draw()">${reg?'I already have an account':'Create a new account'}</button>${reg?'':'<button class="ic" onclick="resetPw()">Forgot password</button>'}</div></div>`}
function vReport(){return `<div class="card"><h2>Report waste</h2>${fileIn('new',0,'1. Photo of the waste (camera or gallery)')}
 ${draft.photo?`<img class="prev" src="${draft.photo}" alt="Photo preview">`:'<p class="note">A photo is required.</p>'}
 <label class="l" for="g">2. Ghat or location</label><select id="g" onchange="draft.g=+this.value">${GH.map((g,i)=>`<option value="${i}"${i===draft.g?' selected':''}>${esc(g.n)}</option>`).join('')}</select>
 <div class="acts"><button class="btn" onclick="getGPS()">📍 Add my exact location</button></div>
 <div class="gps" style="margin-top:6px">${draft.gpsMsg||'Optional. With exact location, volunteers get a Google Maps route to the exact spot.'}</div>
 <label class="l" for="note">3. What kind of waste is it?</label><textarea id="note" rows="2" oninput="draft.note=this.value" placeholder="Example: plastic, puja flowers, drain waste">${esc(draft.note)}</textarea>
 <button class="btn full" onclick="submitReport()">Submit report</button></div><p class="note">You earn 10 points per report. Everyone sees it instantly.</p>`}
function vMap(){
 const st=GH.map((g,i)=>stats(i)),max=Math.max(1,...st.map(s=>s.p)),T=k=>st.reduce((a,s)=>a+s[k],0);
 const col=p=>p?`hsl(${Math.round(30-22*p/max)} 80% 40%)`:'#2E8B57';
 const mk=(x,y,i)=>`<circle cx="${x}" cy="${y}" r="${14+st[i].p/max*6}" fill="${col(st[i].p)}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${st[i].p}</text>`;
 let lab='';[4,5,1,2,3,6].forEach((i,k)=>{const y=45+k*55;lab+=mk(72,y,i)+`<text x="100" y="${y-2}" font-size="13" font-weight="700" fill="currentColor">${GH[i].n}</text><text x="100" y="${y+13}" font-size="11" fill="currentColor" opacity=".75">${st[i].p} pending · ${st[i].c} cleaned</text>`});
 const svg=`<svg viewBox="0 0 340 360" width="100%" style="color:var(--ink)" role="img" aria-label="Hotspot map"><path d="M45 0 C15 60,80 100,45 160 S15 280,50 360" fill="none" stroke="#2F7FBF" stroke-width="34" opacity=".3"/><path d="M45 0 C15 60,80 100,45 160 S15 280,50 360" fill="none" stroke="#2F7FBF" stroke-width="2.5" stroke-dasharray="2 7"/><text transform="translate(22 200) rotate(-90)" font-size="12" font-weight="700" fill="#2F7FBF">River Ganga</text><rect x="238" y="140" width="98" height="105" rx="8" style="fill:var(--card);stroke:var(--river)" stroke-width="2"/><text x="287" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">NIT Patna</text><text x="287" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Campus</text>${mk(287,215,0)}${lab}</svg>`;
 return `<div class="card"><div class="tot"><div><b style="color:var(--red)">${T('r')}</b>Reported</div><div><b style="color:var(--blue)">${T('a')}</b>In progress</div><div><b style="color:var(--green)">${T('c')}</b>Cleaned</div></div></div>
 <div class="card"><h2>Live hotspot map near NIT Patna</h2><p class="note" style="margin-top:0">Number in each circle = pending waste. Green = clean. Updates live for everyone.</p>${svg}<p class="note">Schematic map, not to scale. Use the Google Maps buttons for real locations.</p></div>
 <div class="card"><h2>Locations</h2>${GH.map((g,i)=>({g,i,s:st[i]})).sort((a,b)=>b.s.p-a.s.p).map(o=>`<div style="margin-bottom:12px"><div class="row"><b>${esc(o.g.n)}</b><b>${o.s.p} pending</b></div><div class="bar"><i style="width:${o.s.p/max*100}%"></i></div><div class="row"><span class="note">Reported ${o.s.r} · In progress ${o.s.a} · Cleaned ${o.s.c}</span><a class="btn" href="${gUrl(o.i)}" target="_blank" rel="noopener">🧭 Google Maps</a></div></div>`).join('')}</div>`}
function card(r){

/* ---------- SUPABASE: Firebase-compatible adapter (realtime via Postgres Changes) ---------- */
function supaFirebase(){
 const sb=supabase.createClient(SUPA_URL,SUPA_KEY),T='docs';
 const ok=r=>{if(r.error)throw r.error;return r.data};
 const split=o=>{const p={},i={};for(const k in o){const v=o[k];if(v&&typeof v==='object'&&v.__inc!==undefined)i[k]=v.__inc;else p[k]=v}return[p,i]};
 const dref=(c,id)=>({id,
  get:async()=>{const r=ok(await sb.from(T).select('data').eq('col',c).eq('id',id).maybeSingle());return{id,exists:!!r,data:()=>r?{...r.data}:undefined}},
  set:async(o,op)=>{const [p,i]=split(o);
   if(op&&op.merge){const r=ok(await sb.from(T).select('id').eq('col',c).eq('id',id).maybeSingle());
    if(r){ok(await sb.rpc('doc_update',{p_col:c,p_id:id,p_patch:p,p_inc:i}));return}}
   ok(await sb.from(T).upsert({col:c,id,data:p}))},
  update:async o=>{const [p,i]=split(o);ok(await sb.rpc('doc_update',{p_col:c,p_id:id,p_patch:p,p_inc:i}))},
  delete:async()=>{ok(await sb.from(T).delete().eq('col',c).eq('id',id))}});
 const qry=(c,ord,lim)=>{
  const cmp=(x,y)=>(ord[1]==='desc'?-1:1)*((x.v[ord[0]]>y.v[ord[0]])-(x.v[ord[0]]<y.v[ord[0]]));
  const fetchAll=async()=>{let q=sb.from(T).select('id,data').eq('col',c);
   if(ord)q=q.order('data->>'+ord[0],{ascending:ord[1]!=='desc'});if(lim)q=q.limit(lim);
   return ok(await q).map(r=>({id:r.id,v:r.data}))};
  const mk=(a,prev)=>({docs:a.map(x=>({id:x.id,data:()=>({...x.v}),ref:dref(c,x.id)})),empty:!a.length,
   docChanges:()=>a.filter(x=>!prev.has(x.id)).map(x=>({type:'added',doc:{id:x.id,data:()=>({...x.v})}}))});
  return{orderBy:(f,d)=>qry(c,[f,d||'asc'],lim),limit:n=>qry(c,ord,n),
   get:async()=>mk(await fetchAll(),new Set()),
   onSnapshot:(cb,errcb)=>{const M=new Map();let prev=new Set();
    const emit=()=>{let a=[...M.values()];if(ord)a.sort(cmp);if(lim)a=a.slice(0,lim);cb(mk(a,prev));prev=new Set(a.map(x=>x.id))};
    const ch=sb.channel('rt-'+c+'-'+Math.random().toString(36).slice(2))
     .on('postgres_changes',{event:'*',schema:'public',table:T,filter:'col=eq.'+c},p=>{
      if(p.eventType==='DELETE'){if(p.old.col&&p.old.col!==c)return;M.delete(p.old.id)}

     .subscribe();
    fetchAll().then(a=>{a.forEach(x=>{if(!M.has(x.id))M.set(x.id,x)});emit()}).catch(e=>errcb&&errcb(e));
    return()=>{sb.removeChannel(ch)}}}};
 const db={collection:c=>Object.assign(qry(c,null,0),{doc:id=>dref(c,id),
   add:async o=>{const id=(crypto.randomUUID?crypto.randomUUID():'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));ok(await sb.from(T).insert({col:c,id,data:o}));return dref(c,id)}}),
  doc:q=>{const a=q.split('/');return dref(a[0],a[1])},
  batch:()=>{const ops=[];return{delete:r=>ops.push(()=>r.delete()),update:(r,o)=>ops.push(()=>r.update(o)),commit:async()=>{for(const f of ops)await f()}}}};
 const wrap=u=>u?{uid:u.id,email:u.email,displayName:(u.user_metadata&&u.user_metadata.name)||'',
  updateProfile:async o=>{ok(await sb.auth.updateUser({data:{name:o.displayName}}))}}:null;
 const authObj={onAuthStateChanged:f=>{let last;sb.auth.onAuthStateChange((ev,s)=>{const id=s&&s.user?s.user.id:null;if(ev!=='SIGNED_OUT'&&id===last)return;last=id;setTimeout(()=>f(wrap(s&&s.user)),0)})},
  createUserWithEmailAndPassword:async(em,pw)=>{const r=ok(await sb.auth.signUp({email:em,password:pw}));

  signInWithEmailAndPassword:async(em,pw)=>{ok(await sb.auth.signInWithPassword({email:em,password:pw}))},
  signOut:async()=>{await sb.auth.signOut()},
