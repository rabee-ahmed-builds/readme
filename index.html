nav{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);display:none}

.prev{max-width:100%;max-height:200px;border-radius:10px;margin-top:6px}.s-Pending{background:#8a6d00}.s-Review{background:#7a3fa0}

.empty{text-align:center;color:var(--mute);padding:20px}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tot b{display:block;font-size:26px}

.feed{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed i{font-style:normal;font-size:20px}

.quote{background:var(--river);color:var(--onriver);border:0}.quote p{font-size:19px;font-weight:600;margin:6px 0 0}.quote .note{color:inherit;opacity:.85}

.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.av.big{width:96px;height:96px;font-size:40px;margin:0 auto 10px}
.wb.one{flex-wrap:nowrap;gap:5px}.wb.one>button{flex:1 1 0;min-width:0;padding:8px 2px;font-size:13px;white-space:nowrap;text-align:center}
.lb:not(:has(.wb)){flex-wrap:nowrap}.lb>button{flex:0 0 auto;white-space:nowrap}
.pa span,.avb span{display:block;line-height:1}.av.pa{font-size:26px}.av.big.pa{font-size:46px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px}.avb{aspect-ratio:1;border:2px solid var(--line);border-radius:50%;font-size:24px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes avb0{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}@keyframes avb1{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@keyframes avb2{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}@keyframes avb3{0%,100%{transform:translateX(-9%)}50%{transform:translateX(9%)}}
.a0{animation:avb0 1.6s ease-in-out infinite}.a1{animation:avb1 1.4s ease-in-out infinite}.a2{animation:avb2 1.8s ease-in-out infinite}.a3{animation:avb3 1.7s ease-in-out infinite}
html.rm .a0,html.rm .a1,html.rm .a2,html.rm .a3{animation:none!important}@media(prefers-reduced-motion:reduce){.a0,.a1,.a2,.a3{animation:none!important}}
.avg.ad{grid-template-columns:repeat(4,1fr)}.avc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.avc.off{opacity:.45}.avc .av{width:100%;height:auto;aspect-ratio:1;font-size:26px}.avc .ic{width:100%;padding:3px 0;text-align:center}
#sky{position:absolute;inset:0;perspective:800px;perspective-origin:50% 55%;overflow:hidden}
#sky .sc{position:absolute;inset:-6%;transform-style:preserve-3d;transform:rotateY(calc(var(--px,0)*5deg)) rotateX(calc(var(--py,0)*-3deg));transition:transform .3s ease-out}

.cls{transform:translateZ(-200px) scale(1.25)}.cl{position:absolute;left:-30%;width:130px;height:38px;background:#fff;border-radius:40px;opacity:.88;box-shadow:34px -14px 0 4px #fff,-26px 4px 0 -4px #fff;animation:cd 80s linear infinite}
.sc.g .cl{background:#ffd9c0;box-shadow:34px -14px 0 4px #ffd9c0,-26px 4px 0 -4px #ffd9c0}

.sl{aspect-ratio:auto;height:62vw;min-height:300px;max-height:520px}.sl .tx{font-size:24px;padding:22px;line-height:1.35}.sl .cp{font-size:15px;padding:10px 14px}

const cols=c=>COLS[c]||'*';
async function fetchRows(c,ord,lim){let q=sb.from(c).select(cols(c));if(ord)q=q.order(snake(ord[0]),{ascending:ord[1]!=='desc'});
 const {data,error}=await q.limit(lim||1000);if(error)throw error;return data.map(r=>({id:r.id,data:()=>fromDb(r)}))}
const dref=(c,id)=>({id,
 get:async()=>{const {data,error}=await sb.from(c).select(cols(c)).eq('id',id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data?fromDb(data):undefined}},
 set:async o=>{const {error}=await sb.from(c).insert(Object.assign({id},toDb(o)));if(error&&error.code!=='23505')throw error},
 update:async o=>{const {error}=await sb.from(c).update(toDb(o)).eq('id',id);if(error)throw error}});
function qry(c,ord,lim){return{
 orderBy:(f,d)=>qry(c,[f,d||'asc'],lim),limit:n=>qry(c,ord,n),
 get:async()=>{const docs=await fetchRows(c,ord,lim);return{docs,empty:!docs.length}},
 onSnapshot:(cb,onErr)=>{let prev=new Set(),dead=false,timer=null,seq=0;
  const run=async()=>{const my=++seq;try{const docs=await fetchRows(c,ord,lim);if(dead||my!==seq)return;const added=docs.filter(d=>!prev.has(d.id));prev=new Set(docs.map(d=>d.id));
   cb({docs,empty:!docs.length,docChanges:()=>added.map(d=>({type:'added',doc:d}))})}catch(e){if(!dead&&onErr)onErr(e)}};
  const kick=()=>{clearTimeout(timer);timer=setTimeout(run,120)};
  const ch=sb.channel('rt-'+c+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:c},kick).subscribe(s=>{if(s==='SUBSCRIBED')run()});
  const vis=()=>{if(!document.hidden)run()};document.addEventListener('visibilitychange',vis);const iv=setInterval(vis,20000);run();
  return()=>{dead=true;clearInterval(iv);clearTimeout(timer);document.removeEventListener('visibilitychange',vis);sb.removeChannel(ch)}}}}
const dbShim={collection:c=>Object.assign(qry(c,null,0),{doc:id=>dref(c,id),add:async o=>{const {error}=await sb.from(c).insert(toDb(o));if(error)throw error;return{}}})};

function readPhoto(file,cb){
 const r=new FileReader();r.onerror=()=>toast('Could not read this photo');
 r.onload=()=>{const raw=r.result,im=new Image();
  im.onload=()=>{try{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))}catch(e){cb(raw)}};
  im.onerror=()=>{if(String(raw).length<700000)cb(raw);else toast('Photo format not supported. Use JPG or PNG.')};im.src=raw};
 r.readAsDataURL(file)}

 const bad=e=>{draft.lat=null;draft.manual=true;draft.gpsMsg=e.code===1?'The browser is blocking location for this site. Tap the lock icon next to the web address, open Permissions (Site settings), set Location to Allow, and try again. Also switch on the phone Location. Or type your location below.':'Could not get your location. Switch on the phone Location (GPS) and try again, or type it below.';draw()};
 navigator.geolocation.getCurrentPosition(ok,e=>{if(e.code===1)return bad(e);navigator.geolocation.getCurrentPosition(ok,bad,{timeout:20000,enableHighAccuracy:true,maximumAge:0})},{timeout:12000,enableHighAccuracy:false,maximumAge:60000})}

function card(r){
 const vol=isVol(),mem=isMem(),own=r.repUid===U.uid,cl=r.byUid===U.uid,pend=r.st==='Pending'||r.st==='Review';let a=`<a class="btn" href="${navUrl(r)}" target="_blank" rel="noopener">🧭 Navigate in Google Maps</a>`,x='';
 if(!pend&&vol&&r.st==='Reported')a+=`<button class="btn alt" onclick="takeTask('${r.id}')">Accept task</button>`;
 if(pend&&mem)a+=`<button class="btn" onclick="review('${r.id}',true)">✅ Approve</button><button class="btn red" onclick="review('${r.id}',false)">❌ Decline</button>`;
 if(pend&&!mem)x+=`<p class="note">${r.st==='Review'?'An admin is reviewing this report.':'Waiting for a member to approve. Then everyone can see it.'}</p>`;
 if(r.photo&&(own||mem))a+=`<button class="ic" onclick="rmPhoto('${r.id}','photo')">${own?'🗑 Remove photo (cancels my report)':'🗑 Remove photo (user must add a new one)'}</button>`;
 if(r.after&&(cl||mem))a+=`<button class="ic" onclick="rmPhoto('${r.id}','after')">🗑 Remove after photo</button>`;
 if(!r.photo)x+=fileIn('before',r.id,'Add before photo');
 else if(own||mem)x+=fileIn('replace',r.id,'Edit: replace before photo');
 if(r.after&&(cl||mem))x+=fileIn('replacea',r.id,'Edit: replace after photo');
 if(!pend&&vol&&r.st==='Assigned')x+=fileIn('after',r.id,'Upload after photo (marks the task as cleaned)');
 if(!pend&&!vol&&r.st!=='Cleaned')x+='<p class="note">Switch to Volunteer (top) to accept or clean this task.</p>';
 const L=['Reported','Assigned','Cleaned'],i=L.indexOf(r.st);
 return `<div class="card"><div class="row"><b>${esc(gh(r.g).n)}${r.bld&&bName(r.bld)?' · '+esc(bName(r.bld)):''}</b><span class="badge s-${r.st}">${r.st==='Review'?'Admin review':r.st}</span></div>
 <div class="gps">${esc(r.note)} · ${ago(r.t)} · by ${esc(r.repName)}${r.byName?' · cleaner: '+esc(r.byName):''}</div>
 <div class="steps">${L.map((s,k)=>`<span class="${k<=i?'done':''}">${s}</span>`).join('')}</div>
 <div class="ba"><figure>${r.photo?`<img src="${r.photo}" alt="Before" onclick="openImg(this.src)">`:'<div class="ph"></div>'}Before</figure><figure>${r.after?`<img src="${r.after}" alt="After" onclick="openImg(this.src)">`:'<div class="ph"></div>'}After</figure></div>
 <div class="acts">${a}</div>${x}</div>`}
function onPhoto(t){
 const f=t.files&&t.files[0],kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{
  const r=id&&id!=='0'?rep(id):null,T=()=>db.collection('reports').doc(id);
  if(kind==='new'){draft.photo=u;draw();toast('Photo added')}
  else if(kind==='slide'){nsl.img=u;draw()}
  else if(kind==='before'){if(r){r.photo=u;draw()}toast('Uploading...');const url=await upPhoto(u);await T().update({photo:url});if(r)r.photo=url;draw();toast('Photo saved')}
  else if(kind==='replace'||kind==='replacea'){const w=kind==='replace'?'photo':'after';if(r){r[w==='photo'?'photo':'after']=u;draw()}toast('Uploading...');const url=await upPhoto(u);await rpcT('replace_photo',{p_id:id,p_which:w,p_url:url});if(r)r[w==='photo'?'photo':'after']=url;draw();toast('Photo updated')}
  else if(kind==='after'){r.after=u;draw();toast('Uploading...');const url=await upPhoto(u);await T().update({st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});Object.assign(r,{st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});draw();
   await log('clean',ME.name+' cleaned '+gh(r.g).n);toast('Cleanup recorded. +30 points')}
 }catch(e){toast(errMsg(e));sd()}})}

 <div class="card"><h2>Vote on reports (${q.length})</h2><p class="note" style="margin-top:0">New reports come here first. Approve to show a report in Status. Decline to delete it for good.</p>${q.length?q.map(card).join(''):'<p class="note">Nothing waiting.</p>'}</div>

function applyPrefs(){const h=document.documentElement,c=h.classList;

 const dk=isDark();c.toggle('dk',dk);

 if(PR.size==='l')c.add('t2');if(PR.size==='x')c.add('t3');if(PR.font==='r')c.add('fr');if(PR.font==='s')c.add('fs');
 if(PR.dens==='c')c.add('d1');if(PR.dens==='r')c.add('d3');if(PR.round==='s')c.add('sq');
 if(PR.rm)c.add('rm');if(PR.hc)c.add('hc');if(PR.ul)c.add('ul');if(PR.big)c.add('big');if(PR.cb)c.add('cb');

function applyBg(){const el=$('bgl');if(!el)return;const L=[],D=BG.dim/100;

 if(BG.pat==='grid'){L.push(['linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px)','28px 28px','repeat']);L.push(['linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px)','28px 28px','repeat'])}
 if(BG.pat==='waves')L.push(['url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2760%27 height=%2730%27%3E%3Cpath d=%27M0 15 Q15 0 30 15 T60 15%27 fill=%27none%27 stroke=%27rgba(0,0,0,.12)%27 stroke-width=%271.5%27/%3E%3C/svg%3E")','60px 30px','repeat']);

 else if(BG.mode==='color')L.push(['linear-gradient('+BG.color+','+BG.color+')','auto','no-repeat']);
 else if(PRESETS[pid])L.push([PRESETS[pid],'auto','no-repeat']);
 el.style.backgroundImage=L.map(x=>x[0]).join(',');el.style.backgroundSize=L.map(x=>x[1]).join(',');el.style.backgroundRepeat=L.map(x=>x[2]).join(',');el.style.backgroundPosition='center';

const istH=()=>new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4).getHours();
const skyPhase=h=>h>=7&&h<17?'d':(h>=5&&h<7)||(h>=17&&h<19)?'g':'n';
function skyHtml(ph){let st='',cl='',dy='',i;
 if(ph==='n')for(i=0;i<46;i++)st+=`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*50}%;animation-delay:${-Math.random()*4}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px"></i>`;
 if(ph!=='n')for(i=0;i<5;i++)cl+=`<b class="cl" style="top:${5+i*8}%;animation-duration:${70+i*19}s;animation-delay:${-i*15}s"></b>`;
 if(ph!=='d')for(i=0;i<9;i++)dy+=`<u class="dy" style="left:${5+i*11}%;top:${8+(i*37)%75}%;animation-delay:${-i*.7}s"></u>`;
 return `<div class="sc ${ph}"><div class="ly sk0"></div><div class="ly ${ph==='n'?'mo':'su'}"></div><div class="ly stl">${st}</div><div class="ly cls">${cl}</div><div class="ly hl"></div><div class="ly gh"><span style="width:55%"></span><span style="width:78%"></span><span style="width:100%"></span></div><div class="ly rv">${dy}</div></div>`}
function buildSky(on){const el=$('bgl'),h=document.documentElement;clearInterval(skyT);let sk=$('sky');
 if(!el)return;if(!on){if(sk)sk.remove();skyPh='';h.classList.remove('nt');return}
 const ph=skyPhase(istH());h.classList.toggle('nt',ph==='n');
 if(!sk||skyPh!==ph){if(sk)sk.remove();skyPh=ph;sk=document.createElement('div');sk.id='sky';sk.innerHTML=skyHtml(ph);el.appendChild(sk)}
 skyT=setInterval(()=>buildSky(true),6e4)}
const skyMove=(x,y)=>{const e=document.querySelector('#sky .sc');if(e&&!PR.rm){e.style.setProperty('--px',x);e.style.setProperty('--py',y)}};
addEventListener('pointermove',e=>skyMove((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;skyMove(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)))},{passive:true});
function buildFx(){const f=$('fx');if(!f)return;f.innerHTML='';const e=FXE[BG.fx];if(!e||PR.rm)return;
 const n={f:8,n:16,m:28}[BG.cnt]||16,sp={c:1.7,n:1,l:.6}[BG.spd]||1;
 for(let i=0;i<n;i++){const x=document.createElement('span');x.className='fp';x.textContent=e[0];const d=(9+Math.random()*10)*sp;
  x.style.left=(Math.random()*100)+'%';x.style.fontSize=(14+Math.random()*16)+'px';x.style.setProperty('--dx',(Math.random()*80-40)+'px');
  if(e[1]==='tw'){x.style.top=(Math.random()*100)+'%';x.style.animation='tw '+((2+Math.random()*3)*sp)+'s ease-in-out infinite';x.style.animationDelay=(-Math.random()*4)+'s'}

 try{if(emChange||pwChange){if(!cp){toast('Enter your current password');return}const {error:e1}=await sb.auth.signInWithPassword({email:U.email,password:cp});if(e1)throw new Error('Current password is wrong');

/* ===== owner-only: manage admins ===== */
const OWNER_ID='1a1def4e-fc51-4250-bfe9-4b70fc859d8d';
function vAdminsAdmin(){if(U.uid!==OWNER_ID)return '<div class="card"><p class="note" style="margin:0">Only the owner can manage admins.</p></div>';
 const pool=users.filter(u=>u.access!=='admin'&&!u.blocked),ad=users.filter(u=>u.access==='admin'&&u.id!==U.uid);
 return `<div class="card"><h2>Add an admin</h2><p class="note" style="margin-top:0">Only you (the owner) can add admins. They still need the admin password to open the admin page.</p>${pool.length?`<div class="acts" style="margin-top:0"><select id="aa" style="flex:1">${pool.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="btn" onclick="addAdminNow()">Make admin</button></div>`:'<p class="note">Nobody to add.</p>'}</div>
 <div class="card"><h2>Other admins</h2>${ad.length?ad.map(u=>`<div class="lb"><span class="nm"><b>${esc(u.name)}</b>${u.blocked?' · blocked':''}</span><span class="wb one"><button class="ic" onclick="rmAdminNow('${u.id}')">Remove</button><button class="ic" ${u.blocked?'disabled style="opacity:.4"':''} onclick="blkAdminNow('${u.id}',true)">Block</button><button class="ic" ${u.blocked?'':'disabled style="opacity:.4"'} onclick="blkAdminNow('${u.id}',false)">Unblock</button></span></div>`).join(''):'<p class="note">No other admins.</p>'}</div>`}
async function addAdminNow(){try{await rpcT('owner_add_admin',{p_id:$('aa').value});toast('Admin added')}catch(e){toast(errMsg(e))}}
async function rmAdminNow(id){if(!confirm('Remove this person from admin?'))return;try{await rpcT('owner_remove_admin',{p_id:id});toast('Removed from admin')}catch(e){toast(errMsg(e))}}
async function blkAdminNow(id,v){try{await rpcT('owner_set_admin_blocked',{p_id:id,p_val:v});toast(v?'Admin blocked':'Admin unblocked')}catch(e){toast(errMsg(e))}}

loadLook();
init();
</script>
</body>
</html>
