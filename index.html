body{background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:16px;line-height:1.45}

.ic{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 10px;font:600 13px Mukta,sans-serif;cursor:pointer}
.tag{background:var(--gold);color:#10242B;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
.feed{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed i{font-style:normal;font-size:20px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.quote{background:var(--river);color:var(--onriver);border:0}.quote p{font-size:19px;font-weight:600;margin:6px 0 0}.quote .note{color:inherit;opacity:.85}
</style>
</head>

<script>

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6Ynl0aGZpdnBzZGhhd29ka3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTE0ODEsImV4cCI6MjEwODkyNzQ4MX0.I-mgGTMdchJa5jGq2tgYepvx68l4e5ZpdfvGIn-BJ8s';

/* ---- tiny data layer: same shape the app already uses, but backed by Supabase (Postgres + Realtime) ---- */
const snake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase()),camel=k=>k.replace(/_([a-z])/g,(m,c)=>c.toUpperCase());
const toDb=o=>{const r={};for(const k in o)r[snake(k)]=o[k];return r};
const fromDb=o=>{const r={};for(const k in o)r[camel(k)]=o[k];return r};
const COLS={users:'id,name,pts,role,t,manual,access,blocked,pending_access'};
let props=[],settings={},shownNeed=false,locs=[],mots=[],ld={n:'',q:'',open:false},motOpen=false,mtxt='',priv=[],ads=[],notices=[],flags=[],bi=0,bt=null,mapG=0,mapT='m',nsl={k:'ad',a:'',l:'',img:null};

async function loadEff(q){const o=eff;try{const {data}=await sb.rpc('my_access_state');eff=data||'user'}catch(e){}if(!q||eff!==o)draw()}
setInterval(()=>{if(eff!=='user'&&!document.hidden)loadEff(true)},60000);
async function unlock(k){const el=$(k==='admin'?'upa':'upm');try{await rpcT('unlock_access',{p_kind:k,p_code:el.value});el.value='';await loadEff();toast('Unlocked')}catch(e){toast(errMsg(e))}}
async function rpcT(fn,a){const {data,error}=await sb.rpc(fn,a||{});if(error)throw error;if(data!=='ok')throw new Error(data==='locked'?'Too many wrong tries. Wait 15 minutes.':data==='wrong'?'Wrong password':String(data));return data}
function openImg(u){const l=$('lbx');l.querySelector('img').src=u;l.style.display='flex'}
const cols=c=>COLS[c]||'*';
async function fetchRows(c,ord,lim){let q=sb.from(c).select(cols(c));if(ord)q=q.order(snake(ord[0]),{ascending:ord[1]!=='desc'});
 const {data,error}=await q.limit(lim||1000);if(error)throw error;return data.map(r=>({id:r.id,data:()=>fromDb(r)}))}
const dref=(c,id)=>({id,
 get:async()=>{const {data,error}=await sb.from(c).select(cols(c)).eq('id',id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data?fromDb(data):undefined}},
 set:async o=>{const {error}=await sb.from(c).insert(Object.assign({id},toDb(o)));if(error&&error.code!=='23505')throw error},
 update:async o=>{const {error}=await sb.from(c).update(toDb(o)).eq('id',id);if(error)throw error}});
function qry(c,ord,lim){return{
 orderBy:(f,d)=>qry(c,[f,d||'asc'],lim),limit:n=>qry(c,ord,n),
 get:async()=>{const docs=await fetchRows(c,ord,lim);return{docs,empty:!docs.length}},
 onSnapshot:(cb,onErr)=>{let prev=new Set(),dead=false,timer=null,seq=0;
  const run=async()=>{const my=++seq;try{const docs=await fetchRows(c,ord,lim);if(dead||my!==seq)return;const added=docs.filter(d=>!prev.has(d.id));prev=new Set(docs.map(d=>d.id));
   cb({docs,empty:!docs.length,docChanges:()=>added.map(d=>({type:'added',doc:d}))})}catch(e){if(!dead&&onErr)onErr(e)}};
  const kick=()=>{clearTimeout(timer);timer=setTimeout(run,120)};
  const ch=sb.channel('rt-'+c+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:c},kick).subscribe(s=>{if(s==='SUBSCRIBED')run()});
  const vis=()=>{if(!document.hidden)run()};document.addEventListener('visibilitychange',vis);const iv=setInterval(vis,20000);run();
  return()=>{dead=true;clearInterval(iv);clearTimeout(timer);document.removeEventListener('visibilitychange',vis);sb.removeChannel(ch)}}}}
const dbShim={collection:c=>Object.assign(qry(c,null,0),{doc:id=>dref(c,id),add:async o=>{const {error}=await sb.from(c).insert(toDb(o));if(error)throw error;return{}}})};
/* ---- login layer ---- */
const mkUser=u=>u?{uid:u.id,email:u.email,displayName:(u.user_metadata&&u.user_metadata.name)||''}:null;
const authShim={
 onAuthStateChanged:f=>{let last;sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{const p=prompt('Enter your new password (min 6 characters)');if(p&&p.length>=6)sb.auth.updateUser({password:p}).then(r=>toast(r.error?r.error.message:'Password updated'));else if(p)toast('Password must be at least 6 characters')},600);
  const u=s&&s.user||null,id=u?u.id:null;if(last!==undefined&&id===last)return;last=id;setTimeout(()=>{f(mkUser(u));if(u)loadEff();else eff='user'},0)})},
 createUserWithEmailAndPassword:async(em,pw,meta)=>{const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:meta||{}}});if(error)throw error;
  if(!data.session)throw new Error('Account created. Please confirm your email, then log in.');return{user:mkUser(data.user)}},
 signInWithEmailAndPassword:async(em,pw)=>{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error;try{await sb.rpc('lock_access')}catch(e){}eff='user'},
 signOut:async()=>{try{await sb.rpc('lock_access')}catch(e){}eff='user';await sb.auth.signOut()},
 sendPasswordResetEmail:async em=>{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error}};
/* ---- photos go to Supabase Storage (public bucket), only the link is saved in the report ---- */
async function upPhoto(dataUrl){const blob=await (await fetch(dataUrl)).blob(),ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg',
 path=U.uid+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
 const {error}=await sb.storage.from('report-photos').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});if(error)throw error;
 return sb.storage.from('report-photos').getPublicUrl(path).data.publicUrl}
const READY=true,DEMO=false;
const GH=[
 {n:'NIT Patna Campus',q:'NIT Patna, Ashok Rajpath, Patna, Bihar'},{n:'NIT Ghat',q:'NIT Ghat, Patna, Bihar'},
 {n:'Gandhi Ghat',q:'Gandhi Ghat, Patna, Bihar'},{n:'Gulabi Ghat',q:'Gulabi Ghat, Patna, Bihar'},
 {n:'Kangan Ghat',q:'Kangan Ghat, Patna, Bihar'},{n:'LCT Ghat',q:'LCT Ghat, Patna, Bihar'},{n:'Collectorate Ghat',q:'Collectorate Ghat, Patna, Bihar'}];
const BADGES=[[10,'First Step'],[50,'Ghat Friend'],[120,'Ganga Guardian'],[250,'Namami Hero']];
const ICON={report:'📸',accept:'🤝',clean:'✅',admin:'🛠️',sponsor:'🤝',pledge:'🙏',join:'👋'};
let auth,db,U=null,ME=null,users=[],reports=[],acts=[],sponsors=[],offs=[],firstAct=true;
let tab='report',ctab='mot',rmId=null,filter='All',mode='login',confirmReset=false,busy=false;
let adminOn=false;
let draft={photo:null,lat:null,lon:null,g:0,note:'',gpsMsg:''};try{const d=JSON.parse(localStorage.getItem('ss_draft')||'null');if(d)Object.assign(draft,d)}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};

/* ---------- init ---------- */
function init(){
 auth=authShim;db=dbShim;
 auth.onAuthStateChanged(async u=>{
  offs.forEach(f=>f());offs=[];U=u;ME=null;firstAct=true;
  if(u){
   try{const ref=db.collection('users').doc(u.uid),s=await ref.get();
    if(!s.exists)await ref.set({name:u.displayName||(u.email||'User').split('@')[0],email:u.email||'',pts:0,role:'citizen',t:Date.now()})}catch(e){toast(errMsg(e))}
   const fail=e=>toast(errMsg(e));
   offs.push(db.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));const had=!!ME;ME=users.find(x=>x.id===u.uid)||null;if(had&&!ME){toast('You were removed by the admin.');auth.signOut();return}sd()},fail));
   offs.push(db.collection('reports').orderBy('t','desc').limit(100).onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));if(!shownNeed&&U&&reports.some(r=>r.repUid===U.uid&&!r.photo)){shownNeed=true;tab='report'}sd()},fail));
   offs.push(db.collection('activity').orderBy('t','desc').limit(40).onSnapshot(s=>{
    if(!firstAct)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().uid!==u.uid)notify(c.doc.data().text)});
    firstAct=false;acts=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('ads').orderBy('t','desc').limit(20).onSnapshot(q=>{ads=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('notices').orderBy('t','desc').limit(20).onSnapshot(q=>{notices=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('campus_places').orderBy('idx','asc').limit(300).onSnapshot(q=>{places=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('member_proposals').orderBy('t','desc').limit(50).onSnapshot(q=>{props=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('app_settings').onSnapshot(q=>{settings={};q.docs.forEach(d=>{const x=d.data();settings[x.key]=x.value});sd()},fail));offs.push(db.collection('locations').orderBy('idx','asc').limit(200).onSnapshot(q=>{locs=q.docs.map(d=>({id:d.id,...d.data()}));syncGH();sd()},fail));offs.push(db.collection('motivations').orderBy('t','desc').limit(1).onSnapshot(q=>{mots=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('user_private').onSnapshot(q=>{priv=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));offs.push(db.collection('flags').orderBy('t','desc').limit(50).onSnapshot(q=>{flags=q.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
   offs.push(db.collection('sponsors').orderBy('t','desc').limit(50).onSnapshot(s=>{sponsors=s.docs.map(d=>({id:d.id,...d.data()}));sd()},fail));
  }
  draw()})}
function sd(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;draw()}

async function doLogin(){try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){toast(errMsg(e))}}

document.addEventListener('change',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('file'))onPhoto(t)});
function onPhoto(t){
 const f=t.files&&t.files[0],kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{

 const vol=isVol(),mem=isMem(),own=r.repUid===U.uid,cl=r.byUid===U.uid,pend=r.st==='Pending'||r.st==='Review';let a=`<a class="btn" href="${navUrl(r)}" target="_blank" rel="noopener">🧭 Navigate in Google Maps</a>`,x='';
 if(!pend&&vol&&r.st==='Reported')a+=`<button class="btn alt" onclick="takeTask('${r.id}')">Accept task</button>`;
 if(pend&&mem)a+=`<button class="btn" onclick="review('${r.id}',true)">✅ Approve</button><button class="btn red" onclick="review('${r.id}',false)">❌ Decline</button>`;
 if(pend&&!mem)x+=`<p class="note">${r.st==='Review'?'An admin is reviewing this report.':'Waiting for a member to approve. Then everyone can see it.'}</p>`;
 if(r.photo&&(own||mem))a+=`<button class="ic" onclick="rmPhoto('${r.id}','photo')">${own?'🗑 Remove photo (cancels my report)':'🗑 Remove photo (user must add a new one)'}</button>`;
 if(r.after&&(cl||mem))a+=`<button class="ic" onclick="rmPhoto('${r.id}','after')">🗑 Remove after photo</button>`;
 if(!r.photo)x+=fileIn('before',r.id,'Add before photo');
 else if(own||mem)x+=fileIn('replace',r.id,'Edit: replace before photo');
 if(r.after&&(cl||mem))x+=fileIn('replacea',r.id,'Edit: replace after photo');
 if(!pend&&vol&&r.st==='Assigned')x+=fileIn('after',r.id,'Upload after photo (marks the task as cleaned)');
 if(!pend&&!vol&&r.st!=='Cleaned')x+='<p class="note">Switch to Volunteer (top) to accept or clean this task.</p>';
 const L=['Reported','Assigned','Cleaned'],i=L.indexOf(r.st);
 return `<div class="card"><div class="row"><b>${esc(gh(r.g).n)}${r.bld&&bName(r.bld)?' · '+esc(bName(r.bld)):''}</b><span class="badge s-${r.st}">${r.st==='Review'?'Admin review':r.st}</span></div>

 <div class="steps">${L.map((s,k)=>`<span class="${k<=i?'done':''}">${s}</span>`).join('')}</div>
 <div class="ba"><figure>${r.photo?`<img src="${r.photo}" alt="Before" onclick="openImg(this.src)">`:'<div class="ph"></div>'}Before</figure><figure>${r.after?`<img src="${r.after}" alt="After" onclick="openImg(this.src)">`:'<div class="ph"></div>'}After</figure></div>
 <div class="acts">${a}</div>${x}</div>`}
function onPhoto(t){
 const f=t.files&&t.files[0],kind=t.getAttribute('data-kind'),id=t.getAttribute('data-id');
 if(!f)return;toast('Processing photo...');
 readPhoto(f,async u=>{try{
  const r=id&&id!=='0'?rep(id):null,T=()=>db.collection('reports').doc(id);
  if(kind==='new'){draft.photo=u;draw();toast('Photo added')}
  else if(kind==='slide'){nsl.img=u;draw()}
  else if(kind==='before'){if(r){r.photo=u;draw()}toast('Uploading...');const url=await upPhoto(u);await T().update({photo:url});if(r)r.photo=url;draw();toast('Photo saved')}
  else if(kind==='replace'||kind==='replacea'){const w=kind==='replace'?'photo':'after';if(r){r[w==='photo'?'photo':'after']=u;draw()}toast('Uploading...');const url=await upPhoto(u);await rpcT('replace_photo',{p_id:id,p_which:w,p_url:url});if(r)r[w==='photo'?'photo':'after']=url;draw();toast('Photo updated')}
  else if(kind==='after'){r.after=u;draw();toast('Uploading...');const url=await upPhoto(u);await T().update({st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});Object.assign(r,{st:'Cleaned',after:url,byUid:U.uid,byName:ME.name});draw();
   await log('clean',ME.name+' cleaned '+gh(r.g).n);toast('Cleanup recorded. +30 points')}
 }catch(e){toast(errMsg(e));sd()}})}

async function rmPhoto(id,w){try{const r=rep(id),mine=!!r&&r.repUid===U.uid;await rpcT('remove_photo',{p_id:id,p_which:w});

 else{reports=reports.filter(x=>x.id!==id);if(mine&&r){draft={photo:null,lat:r.lat,lon:r.lon,g:r.g,note:r.note,gpsMsg:''};try{localStorage.setItem('ss_draft',JSON.stringify({g:r.g,note:r.note,lat:r.lat,lon:r.lon}))}catch(e){}tab='report';toast('Photo removed. Add a new photo to send the report again. Otherwise it stays cancelled.')}else toast('Report removed')}

/* ---------- NIT Patna campus map ---------- */
let places=[];const bName=k=>{const p=places.find(x=>x.idx===k);return p?p.name:''};
const bCount=k=>reports.filter(r=>r.g===0&&r.bld===k&&(r.st==='Reported'||r.st==='Assigned')).length;
function vCampus(){const W=66,H=58,rows=Math.ceil(BLD.length/5);
 const cells=BLD.map((b,i)=>{const k=i+1,x=6+(i%5)*W,y=6+Math.floor(i/5)*H,n=bCount(k),f=n?'#f4b400':'#d9ece6';
  return `<g><rect x="${x}" y="${y}" width="${W-6}" height="${H-6}" rx="8" fill="${f}" stroke="#0e4f66" stroke-width="1.2"/><text x="${x+(W-6)/2}" y="${y+34}" text-anchor="middle" font-size="9" fill="#0b2b38">${esc(b[0])}</text>${n?`<circle cx="${x+W-17}" cy="${y+13}" r="10" fill="#b3261e"/><text x="${x+W-17}" y="${y+17}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${n}</text>`:''}</g>`}).join('');
 return `<div class="card"><h2>NIT Patna campus map</h2><p class="note" style="margin-top:0">A red number shows how many open waste reports are at that building. This is a simple plan, not to scale.</p><svg viewBox="0 0 ${6+5*W} ${6+rows*H}" style="width:100%;height:auto" role="img" aria-label="NIT Patna campus plan">${cells}</svg></div>`}
function bldSel(){return `<label class="l" for="bld">Which building are you near?</label><select id="bld" onchange="draft.bld=+this.value||null"><option value="">Choose a building</option>${BLD.map((b,i)=>`<option value="${i+1}"${draft.bld===i+1?' selected':''}>${esc(b[1])}</option>`).join('')}</select>`}

async function delMine(id){try{await rpcT('delete_own_report',{p_id:id});reports=reports.filter(x=>x.id!==id);toast('Report deleted');draw()}catch(e){toast(errMsg(e))}}
const pendN=()=>reports.filter(r=>r.st==='Pending'&&r.photo).length;
async function rmPhoto(id,w){try{const r=rep(id),mine=!!r&&r.repUid===U.uid;await rpcT('remove_photo',{p_id:id,p_which:w});
 if(w==='after'){if(r){r.after=null;r.st='Assigned'}toast('After photo removed. The task is open again.')}
 else if(mine&&r){reports=reports.filter(x=>x.id!==id);draft={photo:null,lat:r.lat,lon:r.lon,g:r.g,bld:r.bld||null,note:r.note,gpsMsg:''};try{localStorage.setItem('ss_draft',JSON.stringify({g:r.g,bld:r.bld||null,note:r.note,lat:r.lat,lon:r.lon}))}catch(e){}tab='report';toast('Photo removed. Add a new photo to send the report again. Otherwise it stays cancelled.')}
 else{if(r){r.photo=null;r.after=null;r.st='Pending'}toast('Photo removed. The user has been asked to add a new one.')}
 draw()}catch(e){toast(errMsg(e))}}

 const cells=P.map((b,i)=>{const x=6+(i%5)*W,y=6+Math.floor(i/5)*H,n=bCount(b.idx),l=wrapN(b.name);
  return `<g><rect x="${x}" y="${y}" width="${W-6}" height="${H-6}" rx="8" fill="${n?'#f4b400':'#d9ece6'}" stroke="#0e4f66" stroke-width="1.2"/><text x="${x+(W-6)/2}" y="${y+(l[1]?24:30)}" text-anchor="middle" font-size="9" fill="#0b2b38">${esc(l[0])}</text>${l[1]?`<text x="${x+(W-6)/2}" y="${y+36}" text-anchor="middle" font-size="9" fill="#0b2b38">${esc(l[1])}</text>`:''}${n?`<circle cx="${x+W-17}" cy="${y+13}" r="10" fill="#b3261e"/><text x="${x+W-17}" y="${y+17}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${n}</text>`:''}</g>`}).join('');
 return `<div class="card"><h2>NIT Patna campus area</h2><p class="note" style="margin-top:0">A red number shows how many open waste reports are at that place. This is a simple plan, not to scale.</p>${P.length?`<svg viewBox="0 0 ${6+5*W} ${6+rows*H}" style="width:100%;height:auto" role="img" aria-label="NIT Patna campus area">${cells}</svg>`:'<p class="note">No places added yet.</p>'}</div>`}

let pl={n:''};
function vPlacesAdmin(){return `<div class="card"><h2>Campus places</h2><p class="note" style="margin-top:0">These show in the NIT Patna campus area map and in the report form.</p><label class="l" for="pln">New place</label><input type="text" id="pln" maxlength="40" value="${esc(pl.n)}" oninput="pl.n=this.value" placeholder="Example: Boys Hostel 2"><button class="btn full" onclick="addPlace()">Add place</button>${places.length?`<p class="note" style="margin-top:12px">Places now</p>${places.slice().sort((a,b)=>a.idx-b.idx).map(b=>`<div class="lb"><span class="nm">${esc(b.name)}</span><button class="ic" onclick="rmPlace(${b.idx})">Remove</button></div>`).join('')}`:''}</div>`}
async function addPlace(){try{await rpcT('adm_add_place',{p_name:pl.n.trim()});pl.n='';toast('Place added');draw()}catch(e){toast(errMsg(e))}}
async function rmPlace(i){if(!confirm('Remove this place?'))return;try{await rpcT('adm_remove_place',{p_idx:i});toast('Place removed')}catch(e){toast(errMsg(e))}}
async function suggestMember(){try{await rpcT('propose_member',{p_uid:$('sg').value});toast('Sent to the admin')}catch(e){toast(errMsg(e))}}
async function decideProp(id,ok){try{await rpcT('adm_decide_proposal',{p_id:id,p_ok:ok});toast(ok?'Member added':'Declined')}catch(e){toast(errMsg(e))}}
async function rmUser(id){const u=users.find(x=>x.id===id);if(!confirm('Remove '+(u?u.name:'this user')+' and their reports for good?'))return;try{await rpcT('admin_remove_user',{p_id:id});toast('User removed')}catch(e){toast(errMsg(e))}}
function vMembersAdmin(){const pool=users.filter(u=>u.access==='user'&&!u.blocked);
 return `<div class="card"><h2>Add a member</h2>${pool.length?`<div class="acts" style="margin-top:0"><select id="am" style="flex:1">${pool.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="btn" onclick="addMemberNow()">Make member</button></div>`:'<p class="note" style="margin-top:0">Everyone is already a member or admin.</p>'}
 ${props.length?`<p class="note" style="margin-top:12px">Suggested by members</p>${props.map(x=>{const u=users.find(y=>y.id===x.target);return `<div class="lb"><span class="nm"><b>${esc(u?u.name:'Unknown')}</b><div class="note">suggested by ${esc(x.byName)} · ${ago(x.t)}</div></span><button class="btn" onclick="decideProp('${x.id}',true)">Approve</button><button class="ic" onclick="decideProp('${x.id}',false)">Decline</button></div>`}).join('')}`:''}
 <p class="note">To remove a member, use Remove in the Members list above.</p></div>`}

/* ---------- keep the unlock alive while working; contact; guide ---------- */
let lastTouch=0;
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(eff==='user')return;const n=Date.now();if(n-lastTouch<60000)return;lastTouch=n;sb.rpc('touch_access').then(()=>{})},{passive:true}));
function vContact(){const e=settings.contact_email,p=settings.contact_phone;
 return `<div class="card"><h2>Contact the admin</h2>${e||p?`${e?`<p style="margin:4px 0">✉️ <a href="mailto:${esc(e)}">${esc(e)}</a></p>`:''}${p?`<p style="margin:4px 0">📞 <a href="tel:${esc(p.replace(/[^0-9+]/g,''))}">${esc(p)}</a></p>`:''}`:'<p class="note" style="margin-top:0">Admin has not uploaded any contact details.</p>'}</div>`}
function vContactAdmin(){return `<div class="card"><h2>Contact details for users</h2><p class="note" style="margin-top:0">Optional. Users see these at the bottom of their Profile. Leave both empty if you do not want to share any.</p><label class="l" for="cm">Email</label><input type="email" id="cm" maxlength="80" value="${esc(settings.contact_email||'')}"><label class="l" for="cp">Phone</label><input type="text" id="cp" maxlength="15" inputmode="tel" value="${esc(settings.contact_phone||'')}"><button class="btn full" onclick="saveContact()">Save contact details</button></div>`}
async function saveContact(){try{await rpcT('adm_set_contact',{p_email:$('cm').value.trim(),p_phone:$('cp').value.trim()});toast('Contact details saved')}catch(e){toast(errMsg(e))}}
function vGuide(){return `<div class="card"><details><summary style="font-weight:700;cursor:pointer;font-size:17px">📖 How Swach Nova works</summary>
 <div style="margin-top:10px;line-height:1.5;font-size:15px">
 <p><b>1. Report waste.</b> Open Report. Add a photo, choose the ghat (for NIT Patna Campus also choose the place), add your exact location if you can, and write what kind of waste it is. Then press Submit.</p>
 <p><b>2. Members approve.</b> Every new report goes to the members first. When a member approves it, it shows in Status and you get 10 points. If a member declines it, it is deleted.</p>
 <p><b>3. Cleaning.</b> Approved reports are visible to the person who reported, to members and admins, and to the volunteer who accepts the task. Switch to Volunteer at the top, press Accept task (+5 points), clean the place and upload an after photo (+30 points).</p>
 <p><b>4. Hotspots.</b> Shows a Google map where you can change the ghat and switch to satellite, the ghats with the most waste, and the NIT Patna campus area. A red number means open reports at that place.</p>
 <p><b>5. Leaders.</b> Points ranking of everyone who helps.</p>
 <p><b>6. Community.</b> Share the app, read the motivation, see sponsors, activity, notices and ads. The white box at the bottom of the main pages slides through notices, ads and sponsors.</p>
 <p><b>7. Photos.</b> Tap a photo to see it bigger. You can remove your own photo. That cancels the report and brings it back to the Report page with your comment. If an admin or member removes your photo, add a new one or delete that report.</p>
 <p><b>8. Members.</b> In Profile, open Member section, enter the member password and send a request. After the admin approves you, enter the member password each time to open the Member page. Members vote on new reports, report a user, suggest new members and remove wrong photos.</p>
 <p><b>9. Admin.</b> Admin section has its own password. It opens only after you enter it. Admins manage members, users, notices, ads, places, passwords and the share link.</p>
 <p><b>10. Safety.</b> Member and Admin pages lock when you leave them or after 15 minutes without using them. Enter the password again to open them.</p>
 <p><b>Need help?</b> Contact the admin using the details at the bottom of this page.</p></div></details></div>`}

init();
</script>
