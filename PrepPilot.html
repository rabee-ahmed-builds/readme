<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrepPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d5dde6;--hl:#ffd23f;--ok:#1f9d6b;--bad:#d64545;--inp:#f7fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8eef7;--mute:#9aa9c0;--line:#2b3a58;--inp:#101a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8eef7;--mute:#9aa9c0;--line:#2b3a58;--inp:#101a2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.0rem/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.75rem;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:1.125rem;margin:22px 0 6px}
.sub{color:var(--mute);margin:0 0 12px}
nav{display:flex;gap:5px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:9px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 0.8125rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.run{border:2px solid var(--hl)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
input,select,button{font-family:inherit;font-size:0.9375rem}
input,select{background:var(--inp);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=number]{width:76px}
input[type=checkbox]{width:20px;height:20px;accent-color:#e0a800;flex:none}
button.b{background:var(--hl);color:#14213d;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--hl)}
.big{font-size:2.0rem;font-weight:800;letter-spacing:-.03em}
.mute{color:var(--mute);font-size:0.875rem}
.warn{color:var(--bad);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.tag{display:inline-block;font-size:0.75rem;padding:1px 8px;border-radius:20px;background:var(--hl);color:#14213d;font-weight:600}
.day{border-left:4px solid var(--hl);padding-left:10px;margin:12px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:0 12px}
summary{display:flex;gap:8px;align-items:center;padding:11px 0;cursor:pointer;font-weight:600}
.tp{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
details>.row{padding:4px 0 10px;border-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.tile{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font-family:inherit;font-size:0.9375rem}
.tile:hover{border-color:var(--hl)}
.tp{display:flex;gap:8px;align-items:center}
.tpb{flex:1;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--ink);padding:9px 0;cursor:pointer;font-size:0.9375rem;font-family:inherit}
.bx{width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:0.875rem;flex:none}
.on .bx{background:var(--hl);border-color:var(--hl);color:#14213d;font-weight:800}
.st .nm{text-decoration:line-through;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);animation:bl 1s infinite}
.dot.off{background:var(--mute);animation:none}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.seg{display:flex;gap:6px;margin:6px 0 10px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 0.875rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.chh{font-weight:600;margin-top:10px}
.tp2{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.pad{padding-bottom:6px}
.col{display:flex;flex-direction:column;gap:8px}.col input{width:100%}#head button{margin-left:6px;padding:3px 10px;font-size:0.8125rem}
body{background-color:var(--bg);background-image:var(--bgi,none);background-attachment:fixed;background-size:cover;min-height:100vh}
nav{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin:6px 0;box-shadow:0 4px 14px rgba(20,33,61,.12)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:transparent;font-size:.75rem}
nav button.on{background:var(--ink);color:var(--bg)}
nav svg{width:22px;height:22px}
.card,details,.tile{box-shadow:0 1px 4px rgba(20,33,61,.08)}
.tile.sel{border:2px solid var(--hl)}
.right{text-align:right;line-height:1.3}
:root[data-rm="1"] .dot{animation:none}
:root[data-rm="1"] *{scroll-behavior:auto;transition:none}
:root[data-font="read"] *{font-family:"Atkinson Hyperlegible",system-ui,sans-serif!important}
.tag2{color:var(--mute);font-size:.8125rem;font-weight:600;letter-spacing:.04em}#head{font-style:italic;margin-top:6px}
textarea{background:var(--inp);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:.9rem}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;display:none;cursor:pointer}#toast.show{display:block}
.brand{display:flex;gap:14px;align-items:center;margin:6px 0 4px}.logo{width:88px;height:88px;flex:none;border-radius:22px;box-shadow:0 4px 14px rgba(20,33,61,.25)}.brand h1{margin:0}.brand .sub{margin:4px 0 0}.tiles.one{grid-template-columns:1fr}
.modal{position:fixed;inset:0;background:rgba(10,18,36,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal[hidden]{display:none}.mbox{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}.mbox p{margin:8px 0 14px}
.ti{width:42px;height:42px;border-radius:12px;background:var(--hl);color:#14213d;display:flex;align-items:center;justify-content:center;flex:none}.ti svg{width:22px;height:22px}.tiles.one .tile{flex-direction:row;align-items:center;gap:14px}.tt{flex:1}
.syn{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}.syn.live{background:var(--ok)}.syn.offline{background:var(--bad)}
</style>
</head>

if(ssec==="prog"){h+=`<div class="mute">This ticks the first topics of a chapter to match the percentage.</div>`+Object.keys(S.dl).map(s=>det("m"+s,`<span class="grow">${esc(s)}</span><span class="mute">${sp(s)}%</span>`,S.ch.filter(c=>c.s===s).map(c=>`<div class="row tp"><span class="grow">${esc(c.n)}</span><input type="number" data-mp="${c.id}" min="0" max="100" value="${cp(c)}" aria-label="Percent"> %</div>`).join(""))).join("")}
if(ssec==="data")h+=`<div class="card"><p class="mute">Clears all ticks, plan selections, homework, study log and the timer. Your subjects, chapters and topics stay.</p><button class="g" id="rs">${armed==="reset"?"Tap again to clear everything":"Reset progress"}</button></div>`;
if(ssec==="profile"&&user==="guest")h+=vGuestProf();else if(ssec==="profile"){const o=overall();h+=`<div class="card"><div class="mute">Signed in as</div><b>${esc(user)}</b><div class="mute" style="margin-top:10px">Overall syllabus completed</div><div class="big">${o}%</div>${bar(o)}<div class="row" style="margin-top:10px"><span class="syn ${syncState}"></span><span class="mute">${syncTxt()}</span></div><div class="row" style="margin-top:10px"><button class="b" data-out="1">Log out</button></div></div>`}
if(ssec==="look")h+=vLook();
if(ssec==="subjects")h+=`<div class="card"><div class="mute">Removing a subject deletes all its chapters and topics.</div>`+Object.keys(S.dl).map(s=>`<div class="row" style="margin-top:8px"><span class="grow">${esc(s)}</span><button class="g" data-dsub="${esc(s)}">${armed==="sub"+s?"Tap again to remove":"Remove"}</button></div>`).join("")+"</div>";
if(ssec==="share")h+=vShare();
if(ssec==="lib")h+=vLib();
if(ssec==="build")h+=vBuild();
if(ssec==="rem")h+=vRem();
return h}
function render(){const y=scrollY,n=note;note="";if(S&&!S.rem)S.rem={on:0,min:30,idle:0,last:0};const nh=n?`<div class="card" role="alert"><b>${esc(n)}</b></div>`:"";
if(!user){$("head").textContent=quote();$("nav").innerHTML="";$("v").innerHTML=nh+vAuth();return}
if(uid&&!S&&loading){$("head").textContent=quote();$("nav").innerHTML="";$("v").innerHTML='<div class="card"><b>Loading your data...</b></div>';return}
if(!S){$("head").textContent=quote();$("nav").innerHTML="";$("v").innerHTML=nh+vOnb();return}
const tot=S.ch.reduce((m,c)=>m+c.h,0)||1,all=Math.round(S.ch.reduce((m,c)=>m+c.h*cp(c)/100,0)/tot*100);
$("head").textContent=quote();
$("nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?"on":""}">${ICON[t[0]]}<span>${t[1]}</span></button>`).join("");
$("v").innerHTML=nh+({today:vToday,plan:vPlan,syl:vSyl,work:vWork,set:vSet})[tab]();scrollTo(0,y)}
const go=f=>{f();save();render()};
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset,was=armed;armed="";
const arm=k=>{if(was===k)return true;armed=k;render();return false};
if(d.ui){const[k,v]=d.ui.split(":");UI[k]=v;ws("sp-ui",JSON.stringify(UI));applyUI();render();return}
if(d.sc){scr=d.sc;render();return}
if(t.id==="auth"){doAuth();return}
if(t.id==="guest"){user="guest";ws(SK,user);load();render();return}
if(d.out){logout();return}
if(t.id==="mok"){closePop();return}
if(t.id==="onb"){const ex=Object.keys(EXN).filter(k=>$("ex-"+k).checked);if(!ex.length){note="Select at least one exam.";render();return}const dt={};ex.forEach(k=>dt[k]=$("dt-"+k).value||addDays(today(),120));S=mk(ex,dt,parseFloat($("ohd").value)||6);save();render();return}
if(d.t){tab=d.t;render();scrollTo(0,0);return}
if(d.sub!==undefined){sel=d.sub;render();scrollTo(0,0);return}
if(d.back){sel=null;render();return}
if(d.hs!==undefined){hsel=d.hs;render();scrollTo(0,0);return}
if(d.hback){hsel=null;render();return}
if(d.hm){hmode=d.hm;render();return}
if(d.sec){ssec=d.sec;render();scrollTo(0,0);return}
if(d.sback){ssec=null;render();return}
if(d.tx){const[c,i]=d.tx.split(":"),x=tpc(chap(c),i);go(()=>{x.x=x.x?0:1;if(x.x)x.dd=today();else delete x.dd});return}
if(d.cd){const c=chap(d.cd),v=cp(c)===100?0:1;go(()=>c.t.forEach(x=>{x.x=v;if(v)x.dd=today();else delete x.dd}));return}
if(d.dt){const[c,i]=d.dt.split(":");if(arm("t"+i))go(()=>chap(c).t=chap(c).t.filter(x=>x.id!==i));return}
if(d.dc){if(arm("c"+d.dc))go(()=>S.ch=S.ch.filter(c=>c.id!==d.dc));return}
if(d.dsub!==undefined){if(arm("sub"+d.dsub))go(()=>{S.ch=S.ch.filter(c=>c.s!==d.dsub);delete S.dl[d.dsub];if(sel===d.dsub)sel=null;if(hsel===d.dsub)hsel=null});return}
if(d.atp){const n=$("nt-"+d.atp).value.trim();if(!n)return;go(()=>{chap(d.atp).t.push({id:"t"+(S.nx++),n,x:0,i:0});S.open["s"+d.atp]=1});return}
if(t.id==="acp"){const n=$("nc").value.trim();if(!n){note="Enter a chapter name.";render();return}go(()=>{const id="k"+(S.nx++);S.ch.push({id,s:sel,n,h:parseFloat($("nh").value)||4,t:[{id:"t"+(S.nx++),n,x:0,i:0}]});S.open["s"+id]=1});return}
if(t.id==="nsb"){const n=$("ns").value.trim();if(!n||S.dl[n]){note=n?"That subject already exists.":"Enter a subject name.";render();return}go(()=>{S.dl[n]=$("nd").value||addDays(today(),60);sel=n});return}
if(t.id==="rxb"){const e=$("rx").value,add=exSubs(e).filter(s=>!S.dl[s]);if(!add.length){note="Those subjects are already in your syllabus.";render();return}go(()=>{add.forEach(s=>addSub(S,s,$("rd").value||addDays(today(),120),1));note="Added "+add.length+" subject(s) to your syllabus and plan."});return}
if(d.ci){const c=chap(d.ci),v=c.t.length&&c.t.every(x=>x.i)?0:1;go(()=>c.t.forEach(x=>x.i=v));return}
if(d.ti){const[c,i]=d.ti.split(":"),x=tpc(chap(c),i);go(()=>x.i=x.i?0:1);return}
if(d.start){start(d.start);return}
if(d.stop!==undefined){S.stp=Date.now()-S.run.at;S.stpd=d.stop==="1";save();render();return}
if(t.id==="scan"){S.stp=null;save();render();return}
if(t.id==="ssave"){saveStop();return}
if(d.tick){const p=d.tick.split(":");let o;if(p[0]==="t"){const c=chap(p[1]);o=c&&tpc(c,p[2])}else o=S.as.find(a=>a.id==p[1]);if(o)markDone(d.tick,(o.x||o.d)?0:1);return}
if(t.id==="tb"){const v=$("ts").value;if(v)start(v);else{note="Add topics in Homework first.";render()}return}
if(t.id==="aa"){const n=$("at").value.trim(),p=parseFloat($("ap").value),du=$("ad").value;if(!n||!p||!du){note="Enter a title, due date and number of pages.";render();return}go(()=>S.as.push({id:S.nx++,t:n,s:$("as").value,due:du,p,d:0}));return}
if(d.ax){const a=S.as.find(a=>a.id==d.ax);go(()=>{a.d=a.d?0:1;if(a.d)a.dd=today();else delete a.dd});return}
if(d.ad){go(()=>S.as=S.as.filter(a=>a.id!=d.ad));return}
if(t.id==="cs"){go(()=>S.cap.def=parseFloat($("cd").value)||0);return}
if(t.id==="os"){if($("od").value)go(()=>S.cap.over[$("od").value]=parseFloat($("oh").value)||0);return}
if(d.ro){go(()=>delete S.cap.over[d.ro]);return}
if(t.id==="ts2"){go(()=>{S.mpp=parseFloat($("mp").value)||15;S.warn=parseFloat($("wh").value)||3});return}
if(t.id==="rs2"){go(()=>S.run.at=Date.now()-(parseFloat($("rm").value)||0)*60000);return}
if(d.ld){go(()=>S.log.splice(+d.ld,1));return}
if(t.id==="ma"){const m=parseFloat($("mm").value),k=$("mk").value;if(m>0&&k)go(()=>S.log.push({d:$("md").value||today(),k,l:lab(k),m}));return}
if(d.rmon!==undefined){go(()=>{S.rem.on=+d.rmon;S.rem.last=Date.now();if(S.rem.on)askPerm()});return}
if(d.ri){go(()=>{S.rem.min=+d.ri;S.rem.on=1;S.rem.last=Date.now();askPerm()});return}
if(d.rid!==undefined){go(()=>{S.rem.idle=+d.rid;S.rem.last=Date.now()});return}
if(t.id==="rtest"){askPerm();notify("PrepPilot","Test reminder. This is how your alerts will look.");return}
if(t.id==="shb"){shareApp();return}
if(t.id==="cpb"){copyLink();return}
if(t.id==="lpub"){const P=parseSyl(sbText),ks=Object.keys(P).filter(k=>P[k].length),nm=libName.trim();if(!nm||!ks.length||!sb){popup("Cannot publish","Enter a name and a syllabus in the right format.");return}const id=nm.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"syllabus";sb.from("library").upsert({id,name:nm,body:P,updated_at:new Date().toISOString()}).then(({error})=>{if(error)popup("Could not publish",error.message);else{sbText="";libName="";loadLib();popup("Published","Everyone can add it now.")}});return}
if(d.ldel!==undefined){if(arm("lib"+d.ldel)&&sb)sb.from("library").delete().eq("id",d.ldel).then(({error})=>{if(error)popup("Could not remove",error.message);else loadLib()});return}
if(t.id==="rxb"&&$("rx").value.startsWith("lib:")){const L=LIB[$("rx").value.slice(4)],P=L&&pj(L.json);if(!P){note="That syllabus could not be loaded.";render();return}const dd=$("rd").value||addDays(today(),120);go(()=>{const r=addP(P,dd);note=r.n?"Added "+r.n+" subject(s)."+(r.sk.length?" Already in your syllabus: "+r.sk.join(", "):""):"Those subjects are already in your syllabus."});return}
if(t.id==="sba"){const P=parseSyl(sbText),ks=Object.keys(P).filter(k=>P[k].length);if(!ks.length){note="Nothing to add. Format: # Subject, then Chapter|hours|topic;topic";render();return}const dd=$("sbd").value||addDays(today(),90),sk=[];go(()=>{ks.forEach(k=>{if(S.dl[k]){sk.push(k);return}S.dl[k]=dd;P[k].forEach(c=>S.ch.push({id:"k"+(S.nx++),s:k,n:c.a,h:c.h,t:c.t.map(x=>({id:"t"+(S.nx++),n:x,x:0,i:1}))}))});sbText="";note="Added "+(ks.length-sk.length)+" subject(s)."+(sk.length?" Skipped, already exist: "+sk.join(", "):"")});return}
if(t.id==="rs"){if(arm("reset"))go(()=>{S.ch.forEach(c=>c.t.forEach(x=>{x.x=0;x.i=0;delete x.dd}));S.as=[];S.log=[];S.run=null;S.stp=null;S.cap={def:6,over:{}};S.mpp=15;S.warn=3;S.open={}});return}});
document.addEventListener("change",e=>{const i=e.target,d=i.dataset;if(!S)return;
if(i.id==="ri"||i.id==="rc"){const v=Math.max(0,Math.min(240,parseInt(i.value)||0));if(v){S.rem.on=1;S.rem.min=v;askPerm()}else S.rem.on=0;S.rem.last=Date.now();save();render();return}
if(d.h)chap(d.h).h=Math.max(.5,parseFloat(i.value)||1);
else if(d.mp){const c=chap(d.mp),k=Math.round(Math.max(0,Math.min(100,parseFloat(i.value)||0))/100*c.t.length);c.t.forEach((t,j)=>{t.x=j<k?1:0})}
else if(d.dl)S.dl[d.dl]=i.value;
else if(d.lm)S.log[+d.lm].m=Math.max(0,parseFloat(i.value)||0);
else return;save();render()});
document.addEventListener("input",e=>{if(e.target.id==="bt")bkText=e.target.value;if(e.target.id==="sb")sbText=e.target.value;if(e.target.id==="ln")libName=e.target.value;if(S&&e.target.id==="ap"&&$("ae")){const p=parseFloat(e.target.value);$("ae").textContent=p>0?`Estimated time: ${(p*S.mpp/60).toFixed(1)} h (${Math.round(p*S.mpp)} min)`:"Enter the pages to see the time estimate."}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")doAuth()});
document.addEventListener("toggle",e=>{const d=e.target;if(S&&d.dataset&&d.dataset.id){S.open[d.dataset.id]=d.open?1:0;save()}},true);
setInterval(()=>{remind();if(S&&S.run){const t=fmtT(elapsed()),el=$("el"),lg=$("lg");if(el)el.textContent=t;if(lg)lg.textContent=logged(today()).toFixed(2);document.title=(S.stp==null?"● ":"")+t+" | PrepPilot"}else document.title="PrepPilot"},1000);
document.addEventListener("click",e=>{if(e.target.closest("#toast"))$("toast").classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&uid)pull()});
render();initSb();
</script>
</body>
